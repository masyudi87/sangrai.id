<!DOCTYPE html><html lang="id"><head><title>Produk | Sangrai.id</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="produk">
<header id="nav"></header>
<main class="container py-5">
 <h1 class="judul mb-2">Semua kopi kami</h1>
 <p class="text-muted mb-4">Semua kemasan 250 g. Harga sudah termasuk proses sangrai.</p>
 <form class="row g-2 mb-4" role="search" onsubmit="return false">
  <div class="col-md-8"><label class="visually-hidden" for="cari">Cari kopi</label><input id="cari" class="form-control" placeholder="Cari nama atau daerah, misalnya Bali"></div>
  <div class="col-md-4"><label class="visually-hidden" for="urut">Urutkan</label><select id="urut" class="form-select"><option value="0">Urutan awal</option><option value="1">Harga termurah</option><option value="2">Harga termahal</option></select></div>
 </form>
 <div class="row g-4" id="daftar"></div>
</main>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script>
const d=document.getElementById('daftar'),q=document.getElementById('cari'),u=document.getElementById('urut');
function filter(){let l=PRODUK.filter(p=>(p.nama+p.asal).toLowerCase().includes(q.value.toLowerCase()));
if(u.value==='1')l.sort((a,b)=>a.harga-b.harga);if(u.value==='2')l.sort((a,b)=>b.harga-a.harga);tampil(d,l)}
q.oninput=u.onchange=filter;filter();
</script>
</body></html>
